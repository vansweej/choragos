[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.8", features = ["server", "client", "transport-io", "transport-child-process", "macros", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
regex = "1"
